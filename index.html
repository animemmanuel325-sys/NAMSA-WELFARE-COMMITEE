<html lang="en">

<title>Pentecost University Nursing and Midwifery Student Association (NAMSA) - Welfare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --blue:#0a4aa6; --green:#0f8a43;
  --bg:#f2f8f5; --surface:#ffffff; --ink:#0d1f2d; --muted:#4a5f5a; --line:#d0e2d9;
  --brand:var(--blue); --brand-ink:#ffffff; --go:var(--green); --sun:var(--green); --sun-ink:#ffffff;
  --danger:#b3261e; --danger-bg:#fdecea; --info-bg:#e6f0fb; --ok-bg:#e2f5e9;
  --head:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Source Sans 3','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#07171a; --surface:#0f2a27; --ink:#e8f4ef; --muted:#9bb8af; --line:#21433d;
    --brand:#8fbaff; --brand-ink:#07171a; --go:#3ddc84; --sun:#3ddc84; --sun-ink:#05210f; --danger:#ff8a80; --danger-bg:#3a1714;
    --info-bg:#0f2b45; --ok-bg:#0f3a2d;
  }
}
:root[data-theme="dark"]{
  --bg:#07171a; --surface:#0f2a27; --ink:#e8f4ef; --muted:#9bb8af; --line:#21433d;
    --brand:#8fbaff; --brand-ink:#07171a; --go:#3ddc84; --sun:#3ddc84; --sun-ink:#05210f; --danger:#ff8a80; --danger-bg:#3a1714;
    --info-bg:#0f2b45; --ok-bg:#0f3a2d;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.55}
h1,h2,h3{font-family:var(--head);line-height:1.15;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(2rem,7vw,3.4rem);font-weight:800}
h2{font-size:clamp(1.5rem,4.5vw,2.1rem);font-weight:700}
h3{font-size:1.2rem;font-weight:700}
p{margin:0 0 1em;max-width:68ch}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}

/* header */
.logo-img{flex:none;width:46px;height:46px;border-radius:50%;background:#fff;display:block}
.wm{position:absolute;right:-50px;top:50%;transform:translateY(-50%);width:min(340px,70vw);opacity:.13;pointer-events:none}
.hero{position:relative;overflow:hidden}
.hero .wrap{position:relative}

@media(min-width:900px){.brand{max-width:330px}}
.logo{flex:none;width:40px;height:40px;border-radius:12px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;position:relative}
.logo::after{content:"";position:absolute;right:-3px;bottom:-3px;width:14px;height:14px;border-radius:50%;background:var(--sun);border:2px solid var(--surface)}
.menu-btn{border:1px solid var(--line);background:transparent;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;min-height:44px}
nav.main{display:none;padding:8px 0 14px}
nav.main.open{display:block}
nav.main a{display:block;padding:12px 4px;text-decoration:none;color:var(--ink);font-weight:600;border-bottom:1px solid var(--line)}
nav.main a.active{color:var(--brand);box-shadow:inset 3px 0 0 var(--sun);padding-left:12px}
nav.main a.cta{background:var(--sun);color:var(--sun-ink);border-radius:12px;text-align:center;margin-top:10px;border:0}
@media(min-width:900px){
  .menu-btn{display:none}
  nav.main{display:flex;align-items:center;gap:2px;padding:0}
  nav.main a{border:0;padding:8px 8px;border-radius:8px;font-size:.88rem}
  nav.main a.active{box-shadow:none;background:var(--info-bg);padding-left:10px}
  nav.main a.cta{margin:0 0 0 8px}
}


/* animated hero art */
.hero-in{display:grid;gap:14px}
@media(min-width:800px){.hero-in{grid-template-columns:1fr auto;align-items:center;gap:30px}}
.hero-art{display:flex;align-items:flex-end;gap:18px;color:inherit}
.hero-art svg{display:block;overflow:visible}
.steth{width:84px;height:auto}
.thermo{width:38px;height:auto}
.chest{transform-box:fill-box;transform-origin:center;animation:beat 1.2s ease-in-out infinite}
.ring{transform-box:fill-box;transform-origin:center;animation:ripple 1.2s ease-out infinite}
.merc{transform-box:fill-box;transform-origin:50% 100%;animation:rise 4.5s ease-in-out infinite alternate}
.ecg{stroke-dasharray:700;stroke-dashoffset:700;animation:trace 3.5s linear infinite}
@media(prefers-reduced-motion:reduce){.ecg{stroke-dashoffset:0}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.22)}30%{transform:scale(1)}45%{transform:scale(1.14)}}
@keyframes ripple{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.1);opacity:0}}
@keyframes rise{0%{transform:scaleY(.22)}100%{transform:scaleY(1)}}
@keyframes trace{to{stroke-dashoffset:0}}
.ecgband{margin-top:22px;opacity:.85}
.ecgband svg{width:100%;height:36px;display:block}


nav.main a.cta.alt{background:transparent;color:var(--go);border:2px solid var(--go)}
nav.main a.adm{font-weight:700;color:var(--brand)}
@media(min-width:900px){nav.main a.adm{margin-left:4px;border:1px solid var(--line)}.dock{display:none!important}}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(0,0,0,.08)}
.dock a{flex:1;min-height:48px;padding:10px 8px;font-size:.98rem}
.dock a.alt{background:transparent;border-color:var(--go);color:var(--go)}
@media(max-width:899px){body.hasdock{padding-bottom:84px}}
.toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))!important}
@media(min-width:900px){.toast{bottom:calc(24px + env(safe-area-inset-bottom,0px))!important}}
a.act{display:block;text-decoration:none;color:var(--ink);border-left:6px solid var(--go)}
a.act h3{margin:0 0 4px;color:var(--brand)}
a.act p{margin:0;color:var(--muted);font-size:.97rem}
a.act:hover{background:var(--info-bg)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.gal button{padding:0;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);cursor:pointer;aspect-ratio:1/1;display:block}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal.mini{grid-template-columns:repeat(auto-fill,minmax(76px,1fr))}
.lb{position:fixed;inset:0;background:rgba(3,14,12,.88);z-index:80;display:grid;place-items:center;padding:20px;text-align:center;color:#fff}
.lb img{max-width:92vw;max-height:76vh;border-radius:12px}
.hero-art{display:flex;align-items:center;gap:16px}
.hero-art .steth{display:none;width:88px;height:auto}
@media(min-width:620px){.hero-art .steth{display:block}}
.monitor{width:100%;max-width:390px;background-color:#05241c;background-image:linear-gradient(rgba(93,255,163,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(93,255,163,.08) 1px,transparent 1px);background-size:20px 20px;border:1px solid rgba(255,255,255,.22);border-radius:20px;padding:12px 14px 14px;color:#d8ffe9;box-shadow:0 18px 40px rgba(0,0,0,.28)}
.mon-head{display:flex;align-items:center;gap:8px;font-size:.85rem;opacity:.9}
.live{width:9px;height:9px;border-radius:50%;background:#5dffa3;animation:blink 1.2s infinite}
.ecgsvg{width:100%;height:92px;display:block;filter:drop-shadow(0 0 5px rgba(93,255,163,.85))}
.run{animation:ecgrun 2.4s linear infinite}
.ecgsvg path{vector-effect:non-scaling-stroke}
.vitals{display:flex;justify-content:space-between;gap:8px;margin-top:6px}
.vitals .v{display:flex;align-items:center;gap:6px}
.vitals b{font-family:var(--head);font-size:1.55rem;line-height:1;color:#fff}
.vitals small{font-size:.75rem;opacity:.8}
.heart{width:22px;height:22px;animation:beat 1.2s ease-in-out infinite;transform-origin:center}
.thm{width:14px;height:34px}
.merc2{transform-box:fill-box;transform-origin:50% 100%;animation:rise2 5s ease-in-out infinite alternate}
@keyframes ecgrun{to{transform:translateX(-200px)}}
@keyframes blink{50%{opacity:.25}}
@keyframes rise2{0%{transform:scaleY(.6)}100%{transform:scaleY(1)}}


.lt{position:fixed;inset:0;z-index:90;background:var(--bg);overflow:auto;padding:14px 14px 40px}
.lsheet{background:#fff;color:#000;max-width:794px;margin:14px auto;padding:34px 38px;font-family:'Times New Roman',Georgia,serif;font-size:12pt;line-height:1.45;box-shadow:0 4px 24px rgba(0,0,0,.18);border-radius:4px}
.lsheet *{color:#000}
@page{margin:16mm}
@media print{body>*:not(.lt){display:none!important}.lt{position:static;padding:0;background:#fff;overflow:visible}.lt .noprint{display:none!important}.lsheet{box-shadow:none;margin:0;padding:0;max-width:none;border-radius:0}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 22px;border-radius:14px;border:2px solid transparent;font-weight:700;cursor:pointer;text-decoration:none;text-align:center}
.btn.primary{background:var(--sun);color:var(--sun-ink)}
.btn.dark{background:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.danger{background:var(--danger);color:#fff}
.btn.small{min-height:40px;padding:8px 14px;font-size:.95rem;border-radius:10px}
.btn:hover{filter:brightness(.96)}

/* hero */
.hero{background:linear-gradient(125deg,var(--blue) 0%,var(--green) 100%);color:#fff;padding:34px 0 40px}
.hero :focus-visible{outline-color:#fff}
.hero .btn.primary{background:#fff;color:var(--blue)}
.hero p{max-width:52ch;opacity:.95;font-size:1.1rem}
.hero .acts{display:grid;gap:12px;margin-top:22px;max-width:520px}
@media(min-width:700px){.hero .acts{grid-template-columns:repeat(3,auto);max-width:none;justify-content:start}}
.hero .btn.ghost{border-color:rgba(255,255,255,.55);color:inherit}
.urgent{background:var(--danger-bg);border-left:6px solid var(--danger);border-radius:10px;padding:14px 16px;margin:0 0 18px;color:var(--ink)}
.urgent strong{color:var(--danger)}

section.blk{padding:38px 0}
.grid{display:grid;gap:16px}
@media(min-width:640px){.grid.c2{grid-template-columns:repeat(2,1fr)}.grid.c3{grid-template-columns:repeat(3,1fr)}.grid.c4{grid-template-columns:repeat(4,1fr)}}
@media(min-width:900px){.grid.c4{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.person{text-align:left;padding:0;overflow:hidden;cursor:pointer}
.person:hover{border-color:var(--go)}
.person .more{color:var(--brand);font-size:.85rem;font-weight:600;margin:6px 0 0}
.pd .pcard{background:var(--surface);color:var(--ink);border-radius:18px;padding:20px;max-width:560px;width:100%;max-height:88vh;overflow:auto;text-align:left}
.pd .ph2{width:84px;height:84px;border-radius:50%;overflow:hidden;background:var(--info-bg);border:3px solid var(--go);display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:1.6rem;color:var(--brand);flex:none}
.pd .ph2 img{width:100%;height:100%;object-fit:cover}
.person .ph{width:100%;aspect-ratio:1/1;background:var(--info-bg);display:grid;place-items:center;font-family:var(--head);font-size:2.4rem;font-weight:800;color:var(--brand);overflow:hidden}
.person .ph img{width:100%;height:100%;object-fit:cover;display:block}
.tier{display:flex;justify-content:center;flex-wrap:wrap;gap:14px;margin-bottom:14px}
.tier .person{width:100%}
.tier.xl .person{max-width:380px}
.tier.xl .person .nm{font-size:1.4rem}
.tier.xl .person .pos{font-size:1rem}
.tier.l .person{max-width:300px}
.tier.l .person .nm{font-size:1.2rem}
.tier.m .person{max-width:200px;width:calc(50% - 7px)}
.pd .bigph{width:100%;aspect-ratio:1/1;border-radius:14px;overflow:hidden;background:var(--info-bg);display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:3rem;color:var(--brand);cursor:zoom-in;margin-bottom:12px}
.pd .bigph img{width:100%;height:100%;object-fit:cover}
.person .tx{padding:10px 10px 16px;text-align:center}
.person .pos{color:var(--go);font-weight:700;margin:0 0 2px;font-size:.88rem}
.person .nm{margin:0 0 4px;font-size:1rem}
.person p.ds{color:var(--muted);font-size:.85rem;margin:0}
.grid.ppl{grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:12px}
.steps{display:grid;gap:12px;counter-reset:s;padding:0;list-style:none;margin:0}
.steps li{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.steps li::before{counter-increment:s;content:counter(s);flex:none;width:32px;height:32px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700}
.prose h3{margin-top:1.4em}
.prose .sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.prose .sec p:last-child{margin-bottom:0}

/* forms */
label{display:block;font-weight:600;margin:16px 0 6px}
.hint{color:var(--muted);font-size:.92rem;font-weight:400}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=password],select,textarea{width:100%;min-height:50px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font-size:1rem}
textarea{min-height:120px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 16px;font-weight:600;cursor:pointer;min-height:56px}
.opt:hover,.opt.sel{border-color:var(--brand);background:var(--info-bg)}
.opt .tag{font-size:.8rem;background:var(--danger-bg);color:var(--danger);border-radius:99px;padding:2px 10px;font-weight:700}
.note{background:var(--info-bg);border-radius:12px;padding:12px 14px;margin:14px 0;font-size:.97rem}
.note.ok{background:var(--ok-bg)}
.check{display:flex;gap:12px;align-items:flex-start;margin:16px 0;font-weight:600}
.check input{width:24px;height:24px;margin-top:2px;flex:none}
.row{display:grid;gap:0 14px}
@media(min-width:640px){.row.two{grid-template-columns:1fr 1fr}}

/* status */
.badge{display:inline-block;border-radius:99px;padding:3px 12px;font-weight:700;font-size:.88rem;background:var(--info-bg);color:var(--brand)}
.badge.good{background:var(--ok-bg);color:var(--go)}
.badge.bad{background:var(--danger-bg);color:var(--danger)}
.badge.warn{background:#fff1cc;color:#6b4a00}
.timeline{list-style:none;padding:0;margin:0;border-left:3px solid var(--line)}
.timeline li{padding:0 0 14px 16px;position:relative}
.timeline li::before{content:"";position:absolute;left:-9px;top:6px;width:15px;height:15px;border-radius:50%;background:var(--brand);border:3px solid var(--bg)}
.msg{border-radius:14px;padding:10px 14px;margin:8px 0;max-width:90%}
.msg.c{background:var(--info-bg)}
.msg.m{background:var(--ok-bg);margin-left:auto}
.msg small{color:var(--muted)}
.refbox{font-family:var(--head);font-size:clamp(1.3rem,6vw,2rem);font-weight:800;letter-spacing:.02em;word-break:break-all;background:var(--surface);border:3px dashed var(--brand);border-radius:14px;padding:14px;text-align:center;margin:14px 0}

/* admin */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;-webkit-overflow-scrolling:touch}
.tabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:9px 16px;font-weight:600;cursor:pointer;min-height:44px}
.tabs button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.stats{grid-template-columns:repeat(3,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{font-family:var(--head);font-size:2rem;display:block}
.scroll-x{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:.95rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--info-bg);font-size:.88rem}
tr.click{cursor:pointer}
tr.click:hover{background:var(--info-bg)}
.bars div.br{display:flex;align-items:center;gap:10px;margin:6px 0}
.bars .track{flex:1;background:var(--info-bg);border-radius:8px;height:14px;overflow:hidden}
.bars .fill{height:100%;background:var(--brand);border-radius:8px}
.edit-item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.edit-item .thumb{width:72px;height:72px;border-radius:12px;background:var(--info-bg);overflow:hidden;display:grid;place-items:center;font-weight:800;color:var(--brand);flex:none}
.edit-item .thumb img{width:100%;height:100%;object-fit:cover}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.proto{background:#fff1cc;color:#4a3300;font-size:.9rem;padding:8px 0}
.proto .wrap{display:flex;gap:8px;align-items:flex-start}
footer.foot{background:var(--surface);border-top:1px solid var(--line);padding:26px 0;margin-top:30px;font-size:.95rem;color:var(--muted)}
footer.foot a{color:var(--brand)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:50;max-width:90vw;font-weight:600}
.sr{position:absolute;left:-9999px}
.skip{position:absolute;left:-9999px;top:0;background:var(--sun);color:var(--sun-ink);padding:10px 14px;z-index:99}
.skip:focus{left:10px;top:10px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

function pickCat(id){state.cat=id;state.sub='';state.anon=false;render()}
function backCat(){state.cat=null;render()}
function toggleAnon(v){state.anon=v;render()}
function submitReport(e){
  e.preventDefault();
  if(CONFIG_ERR){$('ferr').textContent='We cannot send requests right now because the website could not connect. Please call the welfare numbers instead.';return false}
  var k=C.categories.filter(function(x){return x.id===state.cat})[0];
  var anon=state.anon&&k.anon;
  function v(id){var el=$(id);return el?el.value.trim():''}
  if(v('hp'))return false; /* spam trap */
  if(Date.now()-(state.formT||0)<3000){$('ferr').textContent='Please wait a moment, then tap Submit again.';return false}
  var err=[];
  if(k.subs.length&&!v('sub'))err.push('Choose which option applies.');
  if(!anon){
    if(!v('fn'))err.push('Enter your full name.');
    if(!v('sid'))err.push('Enter your student or member ID.');
    if(!/^[0-9+\s()-]{7,}$/.test(v('ph')))err.push('Enter a valid phone number.');
    if(v('em')&&!/^\S+@\S+\.\S+$/.test(v('em')))err.push('Check your email address.');
    if(!v('pg'))err.push('Enter your programme or department.');
    if(!v('lv'))err.push('Choose your level.');
  }
  if(!v('ds'))err.push('Describe the situation.');
  var files=[],raw=[];
  var fl=$('fl');
  if(fl&&fl.files){for(var i=0;i<fl.files.length;i++){var f=fl.files[i];
    if(f.size>5*1024*1024){err.push(f.name+' is larger than 5 MB.')}
    else if(!/\.(pdf|jpe?g|png)$/i.test(f.name)){err.push(f.name+' is not a PDF, JPG or PNG.')}
    else{files.push({name:f.name,size:f.size});raw.push(f)}}}
  if(err.length){var el=$('ferr');el.innerHTML=err.map(esc).join('<br>');el.scrollIntoView({block:'center'});return false}
  if(LIVE){var sbtn=e.target.querySelector('button[type=submit]');if(sbtn){sbtn.disabled=true;sbtn.textContent='Sending...'}submitLive(k,anon,v,files,raw,sbtn);return false}
  SEQ++;LS.set('nw_seq',SEQ);
  var year=new Date().getFullYear();
  var ref='NAMSA-WEL-'+year+'-'+String(SEQ).padStart(5,'0');
  var now=Date.now();
  var r={ref:ref,created:now,category:k.label,sub:v('sub'),emergency:k.emergency,anon:anon,
    name:anon?'Anonymous':v('fn'),sid:v('sid'),phone:v('ph'),email:v('em'),programme:v('pg'),level:v('lv'),contact:v('cm'),
    desc:v('ds'),amount:v('am'),files:files,status:'Submitted',
    history:[{t:now,status:'Submitted',by:'Member'}],messages:[],notes:[]};
  REPORTS.unshift(r);saveR();
  logit('System','New request '+ref+' ('+k.label+') received. Alert email to '+C.notify.alertEmail+' (simulated).');
  state.done=r;state.cat=null;state.anon=false;render();
  return false;
}

VIEWS.track=function(){
  var h='<section class="blk"><div class="wrap" style="max-width:640px"><h1>Track my report</h1><form onsubmit="return doTrack(event)"><label for="tr">Reference number</label><input type="text" id="tr" placeholder="NAMSA-WEL-2026-00125" value="'+esc(state.trackRef||'')+'" autocapitalize="characters" required>'
  +'<label for="t4">Last 4 digits of your phone number <span class="hint">(leave empty for anonymous reports)</span></label><input type="text" id="t4" inputmode="numeric" maxlength="4"><p id="terr" role="alert" style="color:var(--danger);font-weight:600"></p><button class="btn dark" type="submit" style="width:100%">Check status</button></form><div id="tres"></div></div></section>';

function doTrack(e){
  e.preventDefault();
  var ref=$('tr').value.trim().toUpperCase(),p4=$('t4').value.trim();
  if(LIVE){liveTrack(ref,p4).then(function(r2){if(!r2){$('terr').textContent='We could not find a report with those details. Check the number and try again.';$('tres').innerHTML='';return}$('terr').textContent='';state.trackRef=ref;state.track4=p4;drawTrack(r2)});return false}
  var r=REPORTS.filter(function(x){return x.ref===ref})[0];
  var ok=r&&(r.anon||(p4&&r.phone.replace(/\D/g,'').slice(-4)===p4));
  if(!ok){$('terr').textContent='We could not find a report with those details. Check the number and try again.';$('tres').innerHTML='';return false}
  $('terr').textContent='';state.trackRef=ref;drawTrack(r);return false;
}
function drawTrack(r){
  var h='<div class="card" style="margin-top:22px"><p><b>'+esc(r.ref)+'</b></p><p>Category: '+esc(r.category)+(r.sub?' ('+esc(r.sub)+')':'')+'<br>Submitted: '+esc(fmt(r.created))+'</p><p style="margin:0">Status: '+badge(r.status)+'</p></div>';
  h+='<h3 style="margin-top:22px">Progress</h3><ul class="timeline">'+r.history.map(function(x){return '<li><b>'+esc(x.status)+'</b><br><span class="hint">'+esc(fmt(x.t))+'</span></li>'}).join('')+'</ul>';
  h+='<h3 style="margin-top:22px">Messages</h3>'+(r.messages.length?r.messages.map(function(m){return '<div class="msg '+(m.from==='Committee'?'c':'m')+'"><small>'+esc(m.from)+' &middot; '+esc(fmt(m.t))+'</small><br>'+esc(m.text)+msgFiles(m,false)+'</div>'}).join(''):'<p class="hint">No messages yet.</p>');
  if(r.status==='Information Required'){h+='<div class="note">The committee needs more information. Reply below.</div>'}
  h+='<label for="rp">Reply to the committee</label><textarea id="rp"></textarea><label for="rpf">Attach documents <span class="hint">(optional: PDF, JPG or PNG, up to 3 files, 5 MB each)</span></label><input type="file" id="rpf" multiple accept=".pdf,.jpg,.jpeg,.png" style="width:100%;padding:10px;border:2px dashed var(--line);border-radius:12px;background:var(--surface)"><button class="btn dark" style="margin-top:10px" onclick="memberReply(\''+esc(r.ref)+'\')">Send reply</button>';
  $('tres').innerHTML=h;
}
function validFiles(input,max){
  var out=[],err='',list=(input&&input.files)?input.files:[];
  if(list.length>max)return {err:'You can attach up to '+max+' files at a time.',files:[]};
  for(var i=0;i<list.length;i++){var f=list[i];
    if(f.size>5*1024*1024){err=f.name+' is larger than 5 MB.';break}
    if(!/\.(pdf|jpe?g|png)$/i.test(f.name)){err=f.name+' is not a PDF, JPG or PNG.';break}
    out.push(f)}
  return {err:err,files:out};
}
function safeName(n){return String(n).replace(/[^A-Za-z0-9._-]/g,'_').slice(-80)}
function randToken(){var a=new Uint8Array(16);try{crypto.getRandomValues(a)}catch(e){for(var i=0;i<16;i++)a[i]=Math.floor(Math.random()*256)}return Array.prototype.map.call(a,function(b){return ('0'+b.toString(16)).slice(-2)}).join('')}
function msgFiles(m,admin){
  var fl=m.files||[];if(!fl.length)return '';
  return '<div class="flex" style="margin-top:6px">'+fl.map(function(f){
    if(f.url)return '<a class="btn ghost small" href="'+esc(safeUrl(f.url))+'" target="_blank" rel="noopener noreferrer">'+esc(f.name)+'</a>';
    if(admin&&LIVE&&f.path)return '<button class="btn ghost small" onclick="openFile(\''+esc(f.path)+'\')">'+esc(f.name)+'</button>';
    return '<span class="badge">'+esc(f.name)+'</span>';
  }).join('')+'</div>';
}
async function memberReply(ref){
  var t=$('rp').value.trim();
  var vf=validFiles($('rpf'),3);
  if(vf.err){toast(vf.err);return}
  if(!t&&!vf.files.length){toast('Write a message or attach a document first');return}
  if(LIVE){
    try{
      toast('Sending...');
      var files=[];
      for(var i=0;i<vf.files.length;i++){
        var f=vf.files[i],path='reply/'+safeName(ref)+'/'+randToken()+'_'+safeName(f.name);
        var up=await sb.storage.from('attachments').upload(path,f,{contentType:f.type||'application/octet-stream'});
        if(up.error)throw up.error;
        files.push({name:f.name,size:f.size,path:path});
      }
      var res=await sb.rpc('member_reply',{p_ref:ref,p_last4:state.track4||'',p_text:t,p_files:files});
      if(res.error||!res.data)throw (res.error||new Error('failed'));
      toast('Reply sent');
      var r2=await liveTrack(ref,state.track4);if(r2)drawTrack(r2);
    }catch(err){toast('Could not send your reply. Please try again.')}
    return;
  }
  var r=REPORTS.filter(function(x){return x.ref===ref})[0];if(!r)return;
  r.messages.push({from:'Member',text:t,files:vf.files.map(function(f){return {name:f.name,size:f.size}}),t:Date.now()});saveR();
  logit('Member','Replied on '+ref+'. Alert to '+C.notify.alertEmail+' (simulated).');
  toast('Reply sent');drawTrack(r);
}

function liveLoginView(){
  return '<section class="blk"><div class="wrap" style="max-width:460px"><h1>Admin sign in</h1><div class="note">For authorised NAMSA Welfare administrators only.</div><form onsubmit="return doLiveLogin(event)"><label for="em2">Email</label><input type="email" id="em2" autocomplete="username" required><label for="pw">Password</label><input type="password" id="pw" autocomplete="current-password" required><p id="lerr" role="alert" style="color:var(--danger);font-weight:600"></p><button class="btn dark" type="submit" style="width:100%">Sign in</button></form></div></section>';
}
async function doLiveLogin(e){
  e.preventDefault();
  var b=e.target.querySelector('button');
  var lk=LS.get('nw_lock',{n:0,until:0});
  if(lk.until>Date.now()){$('lerr').textContent='Too many tries. Please wait 15 minutes and try again.';return false}
  b.disabled=true;
  var r=await sb.auth.signInWithPassword({email:$('em2').value.trim(),password:$('pw').value});
  if(r.error){lk.n=(lk.n||0)+1;if(lk.n>=5){lk.until=Date.now()+15*60000;lk.n=0}LS.set('nw_lock',lk);$('lerr').textContent='Wrong email or password.';b.disabled=false;return false}
  LS.set('nw_lock',{n:0,until:0});
  var ok=await loadStaff(r.data.user);
  if(!ok){$('lerr').textContent='This account is not set up as a Welfare admin yet. Ask the Super Administrator.';b.disabled=false;return false}
  state.mfa=null;render();return false;
}

function mfaView(){
  var m=state.mfa,box='<section class="blk"><div class="wrap" style="max-width:460px">';
  if(!m){startMfa();return box+'<h1>Two-step check</h1><p>One moment...</p></div></section>'}
  if(m.mode==='error'){return box+'<h1>Two-step check</h1><p style="color:var(--danger);font-weight:600">'+esc(m.msg)+'</p><button class="btn ghost" onclick="doSignOut()">Sign out</button></div></section>'}
  var h=box;
  if(m.mode==='enroll'){
    h+='<h1>Set up two-step sign-in</h1><p>This protects the welfare records even if a password is stolen.</p><ol><li>Install <b>Google Authenticator</b> or <b>Microsoft Authenticator</b> on your phone.</li><li>In the app, add an account and scan this code, or type the key.</li></ol><div class="card" style="text-align:center"><img src="'+esc(m.qr)+'" alt="Scan this code with your authenticator app" style="width:200px;height:200px;background:#fff;padding:8px;border-radius:10px"><p class="hint" style="margin:8px 0 0">Or type this key:<br><b style="word-break:break-all">'+esc(m.secret)+'</b></p></div>';
  }else{
    h+='<h1>Two-step check</h1><p>Open your authenticator app and enter the 6-digit code for NAMSA.</p>';
  }
  h+='<form onsubmit="return doMfa(event)"><label for="mc">6-digit code</label><input type="text" id="mc" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required><p id="lerr" role="alert" style="color:var(--danger);font-weight:600"></p><button class="btn dark" type="submit" style="width:100%">'+(m.mode==='enroll'?'Turn on and continue':'Verify')+'</button></form><p style="margin-top:16px"><button class="btn ghost small" type="button" onclick="doSignOut()">Cancel</button></p></div></section>';
  return h;
}
async function startMfa(){
  try{
    var a=await sb.auth.mfa.getAuthenticatorAssuranceLevel();
    if(a.data&&a.data.currentLevel==='aal2'){await finishLogin();return}
    var f=await sb.auth.mfa.listFactors();
    var ver=(f.data&&f.data.totp)||[];
    if(ver.length){state.mfa={mode:'verify',factorId:ver[0].id}}
    else{
      var all=(f.data&&f.data.all)||[];
      for(var i=0;i<all.length;i++){if(all[i].status==='unverified'){await sb.auth.mfa.unenroll({factorId:all[i].id})}}
      var e=await sb.auth.mfa.enroll({factorType:'totp',friendlyName:'NAMSA admin '+Date.now()});
      state.mfa=e.error?{mode:'error',msg:'Could not start two-step setup: '+e.error.message}:{mode:'enroll',factorId:e.data.id,qr:e.data.totp.qr_code,secret:e.data.totp.secret};
    }
  }catch(err){state.mfa={mode:'error',msg:'Could not start the two-step check. Please try again.'}}
  render();
}
async function doMfa(e){
  e.preventDefault();var b=e.target.querySelector('button[type=submit]');b.disabled=true;
  var r=await sb.auth.mfa.challengeAndVerify({factorId:state.mfa.factorId,code:$('mc').value.replace(/\D/g,'')});
  if(r.error){$('lerr').textContent='That code did not work. Check the app and try again.';b.disabled=false;return false}
  await finishLogin();return false;
}
async function finishLogin(){
  state.mfa=null;SESSION.ok2=true;bumpIdle();
  logit(SESSION.name,'Signed in with two-step check.');
  state.adminTab=(SESSION.role==='content')?'people':'reports';
  if(SESSION.role!=='content')await loadReports();
  render();
}
async function loadStaff(user){
  var q=await sb.from('staff').select('role,name').eq('user_id',user.id).maybeSingle();
  if(q.data){SESSION={role:q.data.role,name:q.data.name||ROLES[q.data.role],email:user.email,ok2:false};bumpIdle();return true}
  await sb.auth.signOut();return false;
}
async function restoreSession(){
  var r=await sb.auth.getSession();
  if(r.data&&r.data.session){var ok=await loadStaff(r.data.session.user);if(ok){var aal=await sb.auth.mfa.getAuthenticatorAssuranceLevel();if(aal.data&&aal.data.currentLevel==='aal2'){SESSION.ok2=true;if(SESSION.role!=='content')await loadReports()}}}
}
async function loadContent(){
  var r=await sb.from('site_content').select('key,value');
  if(r.error||!r.data)return;
  var has={};r.data.forEach(function(row){C[row.key]=row.value;has[row.key]=1});
  if(!has.committeeV){C.committeeV=1}
  if(!has.members){C.members=null}
  migrateCommittee();
}

async function storeImg(dataUrl){

async function submitLive(k,anon,v,files,raw,btn){
  try{
    var folder='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
    for(var i=0;i<raw.length;i++){
      var safe=raw[i].name.replace(/[^A-Za-z0-9._-]/g,'_');
      var path=folder+'/'+i+'_'+safe;
      var up=await sb.storage.from('attachments').upload(path,raw[i],{contentType:raw[i].type||'application/octet-stream'});
      if(up.error)throw up.error;
      files[i].path=path;
    }
    var payload={category:k.label,sub:v('sub'),emergency:!!k.emergency,anon:!!anon,name:anon?'Anonymous':v('fn'),sid:v('sid'),phone:v('ph'),email:v('em'),programme:v('pg'),level:v('lv'),contact:v('cm'),descr:v('ds'),amount:v('am'),files:files};
    var r=await sb.rpc('submit_report',{payload:payload});
    if(r.error)throw r.error;
    var d=r.data;
    state.done={ref:d.ref,created:new Date(d.created_at).getTime(),category:k.label,sub:v('sub'),emergency:!!k.emergency,anon:!!anon,email:v('em'),status:d.status};
    state.cat=null;state.anon=false;render();
  }catch(err){
    var el=$('ferr');if(el){el.textContent='Sorry, we could not send your request ('+(err.message||'please try again')+'). If it is urgent, call the emergency number.'}
    if(btn){btn.disabled=false;btn.textContent='Submit request'}
  }
}

/* ---------- letter to Financial Controller ---------- */
function letterEvidenceList(r){
  var ev=[];
  (r.files||[]).forEach(function(f){ev.push({name:f.name,path:f.path||'',isImage:/\.(jpe?g|png)$/i.test(f.name)})});
  (r.messages||[]).forEach(function(m){if(m.from==='Member')(m.files||[]).forEach(function(f){ev.push({name:f.name,path:f.path||'',isImage:/\.(jpe?g|png)$/i.test(f.name)})})});
  return ev;
}
function buildLetterBody(r){
  var who=r.anon?'an anonymous member':(r.name+(r.sid?' (Student ID: '+r.sid+')':'')+(r.programme?', a '+(r.level?'Level '+r.level+' ':'')+r.programme+' student':''));
  var what=r.category+(r.sub?' ('+r.sub+')':'');
  var ev=letterEvidenceList(r),p=[];
  p.push('The Welfare Committee has received and reviewed a request for '+what+' support from '+who+'. The request was submitted on '+fmtDay(r.created)+' under reference number '+r.ref+'.');
  p.push('Reason for the request, as stated by the member:\n'+r.desc);
  if(r.amount)p.push('The member is asking for support of GHS '+r.amount+'.');
  p.push(ev.length?('The member submitted '+ev.length+' supporting document'+(ev.length>1?'s':'')+' as evidence, listed below.'):'The member did not attach any supporting documents.');
  if(r.status==='Approved'||r.status==='Partially Approved')p.push('After its review, the Welfare Committee has marked this request as '+r.status+'.');
  p.push('We therefore submit this request to your office for your consideration and appropriate action. Kindly inform the Welfare Committee of the outcome.');
  return p.join('\n\n');
}

  state.letter={ref:ref,to:L.to||'',cc:L.cc||'',head:L.head||'',sec:L.sec||'',date:fmtDay(Date.now()),
    subject:'REQUEST FOR '+String(r.category).toUpperCase()+' SUPPORT: '+(r.anon?'ANONYMOUS MEMBER':String(r.name).toUpperCase())+' ('+r.ref+')',
    body:buildLetterBody(r),ev:ev};

  drawLetter();
}

async function adminMsg(ref){
  var t=$('am2').value.trim();
  var vf=validFiles($('am2f'),3);
  if(vf.err){toast(vf.err);return}
  if(!t&&!vf.files.length){toast('Write a message or attach a document first');return}
  var r=getR(ref);if(!r)return;
  var files=[];
  if(LIVE){
    toast('Uploading...');
    for(var i=0;i<vf.files.length;i++){
      var f=vf.files[i],path=safeName(ref)+'/'+randToken()+'/'+safeName(f.name);
      var up=await sb.storage.from('member-docs').upload(path,f,{contentType:f.type||'application/octet-stream'});
      if(up.error){toast('Upload failed: '+up.error.message);return}
      files.push({name:f.name,size:f.size,path:path,url:sb.storage.from('member-docs').getPublicUrl(path).data.publicUrl});
    }
  }else{files=vf.files.map(function(f){return {name:f.name,size:f.size}})}
  r.messages.push({from:'Committee',by:SESSION.name,text:t,files:files,t:Date.now()});saveR();syncReport(r);
  logit(SESSION.name,'Sent a message'+(files.length?' with '+files.length+' document(s)':'')+' to the member on '+ref+'.');toast('Message sent');render();
}
function addNote(ref){
  var t=$('nt').value.trim();if(!t)return;
  var r=getR(ref);r.notes.push({by:SESSION.name,text:t,t:Date.now()});saveR();syncReport(r);
  logit(SESSION.name,'Added an internal note on '+ref+'.');toast('Note saved');render();
}

function addPics(k,i,input){
  var files=Array.prototype.slice.call(input.files||[]);if(!files.length)return;
  if(!C[k][i].pics)C[k][i].pics=[];
  toast('Uploading...');
  Promise.all(files.map(function(f){return new Promise(function(res){
    var rd=new FileReader();
    rd.onload=function(){var img=new Image();img.onload=function(){
      var m=Math.min(1,560/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=Math.round(img.width*m);cv.height=Math.round(img.height*m);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);storeImg(cv.toDataURL('image/jpeg',.75)).then(res);
    };img.onerror=function(){res(null)};img.src=rd.result};
    rd.onerror=function(){res(null)};rd.readAsDataURL(f);
  })})).then(function(list){
    list=list.filter(Boolean);list.forEach(function(u){C[k][i].pics.push(u)});
    saveC();logit(SESSION.name,'Added '+list.length+' picture(s) to '+C[k][i].name+'.');render();
  });
}
function rmPic(k,i,j){C[k][i].pics.splice(j,1);saveC();logit(SESSION.name,'Removed a picture from '+C[k][i].name+'.');render()}
function moveP(k,i,d){var j=i+d;if(j<0||j>=C[k].length)return;var t=C[k][i];C[k][i]=C[k][j];C[k][j]=t;saveC();render()}
function rmPhoto(k,i){C[k][i].photo='';saveC();logit(SESSION.name,'Removed a photo from '+k+'.');render()}
function setPhoto(k,i,input){
  var f=input.files&&input.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){var img=new Image();img.onload=function(){
    var s=720,cv=document.createElement('canvas');cv.width=s;cv.height=s;
    var m=Math.min(img.width,img.height),sx=(img.width-m)/2,sy=(img.height-m)/2;
    cv.getContext('2d').drawImage(img,sx,sy,m,m,0,0,s,s);
    toast('Uploading...');
    storeImg(cv.toDataURL('image/jpeg',.82)).then(function(u){if(!u)return;C[k][i].photo=u;saveC();logit(SESSION.name,'Changed a photo in '+k+'.');render()});
  };img.onerror=function(){toast('That image could not be read')};img.src=rd.result};
  rd.readAsDataURL(f);
}

ADMIN.backup=function(){
  return '<h2>Backup and recovery</h2>'+(LIVE?'<div class="note">Requests are stored in your secure Supabase database. Use <b>Download spreadsheet</b> on the Requests tab to keep your own copy.</div>':'')+'<p>Copy the text below and keep it somewhere safe. To recover, paste a saved backup into the box and press Restore. The real site also makes automatic daily backups on the server.</p>'
  +'<button class="btn dark small" onclick="makeBackup()">Create backup text</button><label for="bk">Backup</label><textarea id="bk" style="min-height:160px;font-family:ui-monospace,Menlo,monospace;font-size:.8rem"></textarea><button class="btn ghost small" style="margin-top:10px" onclick="restoreBackup()">Restore from pasted backup</button>'
  +'<div class="note" style="margin-top:18px">Backups include welfare reports. Store them only where authorised administrators can reach them.</div>';
};
function makeBackup(){$('bk').value=JSON.stringify({v:1,t:Date.now(),content:C,reports:REPORTS,log:LOG,seq:SEQ});logit(SESSION.name,'Created a backup.');toast('Backup created. Copy the text.')}
function restoreBackup(){
  try{
    var b=JSON.parse($('bk').value);if(!b||!b.content||!b.reports)throw 0;
    if(!confirm('Replace everything with this backup?'))return;
    C=b.content;if(!LIVE){REPORTS=b.reports;LOG=b.log||[];SEQ=b.seq||0;saveR();LS.set('nw_log',LOG);LS.set('nw_seq',SEQ)}saveC();
    logit(SESSION.name,'Restored from a backup.');toast('Restored');render();
  }catch(e){toast('That does not look like a valid backup')}
}

/* theme follows device; start */
async function boot(){
  if(window.top!==window.self){try{window.top.location=window.self.location}catch(e){document.body.innerHTML=''}return}
  if(!location.hash)location.hash='#/home';
  if(CONFIG_ERR){var pe=$('protoBanner');if(pe){pe.style.display='';pe.style.background='#fdecea';pe.style.color='#7a0f0a';pe.innerHTML='<div class="wrap"><b>The website could not connect to its database.</b> Please do not submit a request right now. Call the welfare numbers instead, or try again later.</div>'}}
  if(LIVE){
    var pb=$('protoBanner');if(pb)pb.style.display='none';
    try{await loadContent()}catch(e){}
    try{await restoreSession()}catch(e){}
  }
  render();
}
boot();
</script>
